name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build arm64
        env:
          GOARCH: arm64
          CGO_ENABLED: 1
        run: |
          go build -o totalmix-mac-volume-key-darwin-arm64 .

      - name: Build amd64
        env:
          GOARCH: amd64
          CGO_ENABLED: 1
        run: |
          go build -o totalmix-mac-volume-key-darwin-amd64 .

      - uses: actions/upload-artifact@v4
        with:
          name: totalmix-mac-volume-key-darwin-arm64
          path: totalmix-mac-volume-key-darwin-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: totalmix-mac-volume-key-darwin-amd64
          path: totalmix-mac-volume-key-darwin-amd64

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/totalmix-mac-volume-key-darwin-arm64/totalmix-mac-volume-key-darwin-arm64
            artifacts/totalmix-mac-volume-key-darwin-amd64/totalmix-mac-volume-key-darwin-amd64

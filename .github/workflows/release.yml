name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
            goarch: arm64
          - os: macos-13
            arch: amd64
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          go build -o totalmix-mac-volume-key-darwin-${{ matrix.arch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: totalmix-mac-volume-key-darwin-${{ matrix.arch }}
          path: totalmix-mac-volume-key-darwin-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/totalmix-mac-volume-key-darwin-arm64/totalmix-mac-volume-key-darwin-arm64
            artifacts/totalmix-mac-volume-key-darwin-amd64/totalmix-mac-volume-key-darwin-amd64
